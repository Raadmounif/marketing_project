<?xml version="1.0" encoding="UTF-8"?>
<!-- Full horizontal logo for print, decks, and social. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" role="img" aria-labelledby="title">
  <title id="title">Puff Plaza</title>
  <defs>
    <linearGradient id="full-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C96A"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="full-cloud" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFF8ED"/>
      <stop offset="100%" stop-color="#D4B896"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#full-frame)"/>
  <rect x="8" y="8" width="48" height="48" rx="12" fill="#14100C"/>
  <g fill="url(#full-cloud)">
    <circle cx="24" cy="34" r="9"/>
    <circle cx="32" cy="30" r="10"/>
    <circle cx="40" cy="34" r="9"/>
    <ellipse cx="32" cy="40" rx="16" ry="8"/>
  </g>
  <text x="74" y="42" font-family="system-ui, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="22" font-weight="800" fill="#E8C96A" letter-spacing="-0.02em">Puff</text>
  <text x="130" y="42" font-family="system-ui, 'Segoe UI', Roboto, Ubuntu, sans-serif" font-size="22" font-weight="800" fill="#F5E6D3" letter-spacing="-0.02em">Plaza</text>
</svg>
